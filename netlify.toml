[build]
  # After the build, point the Stripe webhook at the site's domain (production only).
  command = "npm run build && node scripts/stripe-webhook.mjs"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js runtime: server routes (/api/lead), image and font handling.
[[plugins]]
  package = "@netlify/plugin-nextjs"
